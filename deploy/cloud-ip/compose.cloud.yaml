services:
  app:
    image: presales-ai:cloud-workbench-ux-20261108
    pull_policy: never
    restart: unless-stopped
    env_file: .env.deploy
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - knowledge_data:/app/data
      - service_logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1536m
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':os.environ['PUBLIC_DOMAIN']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  caddy:
    image: caddy:2-alpine
    pull_policy: never
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.cloud:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
volumes:
  knowledge_data:
  service_logs:
  caddy_data:
  caddy_config:
