<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库配置体验</title><link rel="stylesheet" href="/static/experience.css"></head><body>
<header><a class="brand" href="/">问 <span>客服工作台</span></a><nav><a href="/">咨询测试</a><a href="/experience/knowledge" aria-current="page">知识库体验</a><a href="/experience/statistics">数据看板</a></nav><a class="login" href="/admin">管理员登录 ↗</a></header>
<main><div class="heading"><div><p class="eyebrow">KNOWLEDGE STUDIO</p><h1>把一句问题，变成一条知识。</h1><p class="muted">体验创建客户意图、配置话术、验证问法。这里只展示您自己添加的体验内容。</p></div><span class="pill">独立体验区</span></div>
<div class="workspace"><section class="panel"><form id="demo-form"><div class="step">01 创建意图</div><label>客户意图<input id="intent" required maxlength="100" placeholder="例如：有没有赠品？"></label><label>拓展问法<textarea id="variants" rows="3" maxlength="2000" placeholder="每行一种问法，例如：&#10;送什么东西&#10;有赠品吗"></textarea></label>
<div class="step">02 配置答案与条件</div><div class="row"><label>绑定商品<select id="product"><option value="">全部商品</option></select></label><label>客服接待<select id="reception"><option value="all">全部接待</option><option value="presales">售前接待</option><option value="aftersales">售后接待</option></select></label><label>业务状态<select id="stage"><option value="">全部状态</option><option value="presales">售前</option><option value="shipping">发货中</option><option value="received">发货后</option><option value="aftersales">售后</option></select></label></div>
<label>标准话术<textarea id="answer" rows="4" required maxlength="2000" placeholder="填写希望机器人回复的内容，支持换行"></textarea></label><button type="submit">保存体验配置</button><p class="muted small">保存在当前浏览器，不会写入正式知识库，也不会影响其他体验者。</p></form><p id="notice" role="status"></p></section>
<section class="panel"><div class="step">03 验证自己配置的话术</div><p class="muted">按左侧配置的商品与接待条件测试；匹配您填写的标准问题或拓展问法。</p><label>测试问题<input id="question" maxlength="300" placeholder="输入刚才配置的一种问法"></label><button type="button" id="test">测试匹配 ↗</button><div id="result" class="result" aria-live="polite">保存一条体验配置，再试一句问题。</div><div class="list-heading"><h2>我的体验知识 <span id="count">0</span></h2><button id="clear" class="quiet" type="button">清空体验配置</button></div><div id="own-list"></div><a class="text-link" href="/">回到咨询测试，体验完整问答 →</a></section></div></main><script src="/static/knowledge-demo.js"></script></body></html>
