<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开数据看板</title><link rel="stylesheet" href="/static/experience.css"></head><body><header><a class="brand" href="/">问 <span>客服工作台</span></a><nav><a href="/">咨询测试</a><a href="/experience/knowledge">知识库体验</a><a href="/experience/statistics" aria-current="page">数据看板</a></nav><a class="login" href="/admin">管理员登录 ↗</a></header>
<main><div class="heading"><div><p class="eyebrow">SERVICE INSIGHTS</p><h1>每一次测试，都有迹可循。</h1><p class="muted">公开展示全站测试汇总，不展示客户原话、答案明细与正式知识内容。</p></div><span class="pill">公开概览</span></div><section class="filters"><label>时间范围<select id="days"><option value="1">今天</option><option value="7" selected>近7天</option><option value="30">近30天</option><option value="0">全部时间</option></select></label><button id="refresh">刷新数据 ↗</button><span id="updated" class="muted"></span></section><p id="error" role="alert" hidden></p>
<section class="metric-grid"><article class="panel"><span>应答率</span><strong id="response">—</strong><small id="response-count"></small></article><article class="panel"><span>需人工处理率</span><strong id="handoff">—</strong><small id="handoff-count"></small></article><article class="panel"><span>意图识别率</span><strong id="intent">—</strong><small id="intent-count"></small></article><article class="panel"><span>准确率 · 人工评价</span><strong id="accuracy">—</strong><small id="accuracy-count">尚无评价时不计算</small></article></section>
<section class="panel"><h2>咨询与应答趋势</h2><p id="volume" class="muted"></p><div id="trend" class="trend"></div></section><p class="muted small">按测试消息统计，默认排除问候等互动与重复抑制。等待提示、澄清追问和RAG建议不计应答；需人工处理不表示已经完成真人接管。准确率仅基于人工评价，不能等同真实客户解决率。</p></main><script src="/static/statistics-demo.js"></script></body></html>
